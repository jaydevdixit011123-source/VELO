<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELO - Personal AI Desktop Assistant</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--fg:#e2e8f0;--fg2:#94a3b8;--accent:#8b5cf6;--accent2:#7c3aed;--red:#ef4444;--green:#22c55e;--radius:10px;--radius-sm:6px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg);height:100vh;overflow:hidden}
.app{display:flex;height:100vh}
.sidebar{width:220px;background:var(--bg2);display:flex;flex-direction:column;border-right:1px solid var(--bg3);flex-shrink:0}
.logo{padding:16px 20px;font-size:20px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px}
.logo-icon{font-size:22px}
nav{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:2px}
.nav-btn{background:none;border:none;color:var(--fg2);padding:10px 16px;text-align:left;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;transition:all .15s;display:flex;align-items:center;gap:8px}
.nav-btn:hover{background:var(--bg3);color:var(--fg)}
.nav-btn.active{background:var(--accent);color:#fff}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--bg3);display:flex;align-items:center;gap:10px;font-size:11px;color:var(--fg2)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.view{display:none;flex-direction:column;height:100%;overflow:hidden}
.view.active{display:flex}
.view-header{padding:16px 20px;border-bottom:1px solid var(--bg3);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.view-header h2{font-size:17px;font-weight:600}
.status-badge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600}
.status-badge.ok{background:#166534;color:var(--green)}
.status-badge.err{background:#7f1d1d;color:var(--red)}
#view-chat{display:flex;flex-direction:column;height:100%}
.messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 16px;border-radius:var(--radius);font-size:14px;line-height:1.5;word-wrap:break-word;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;background:var(--accent2);color:#fff;border-radius:var(--radius) var(--radius) 4px var(--radius)}
.msg.bot{align-self:flex-start;background:var(--bg2);border-radius:var(--radius) var(--radius) var(--radius) 4px}
.msg.err{align-self:flex-start;background:#7f1d1d;color:#fca5a5;font-size:13px}
.msg.typing{opacity:.6;font-style:italic}
.chat-bar{display:flex;gap:10px;padding:12px 20px;border-top:1px solid var(--bg3);flex-shrink:0}
.chat-bar input{flex:1;padding:10px 16px;background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);color:var(--fg);font-size:14px;outline:none}
.chat-bar input:focus{border-color:var(--accent)}
.chat-bar button{padding:10px 20px;background:var(--accent);border:none;border-radius:var(--radius);color:#fff;font-weight:600;cursor:pointer;font-size:14px}
.chat-bar button:hover{background:var(--accent2)}
.chat-bar button:disabled{opacity:.5;cursor:default}
#voice-status-bar{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--bg2);border-bottom:1px solid var(--bg3);flex-shrink:0}
#voice-indicator{width:10px;height:10px;border-radius:50%;background:var(--bg3)}
#voice-indicator.listening{background:var(--red);animation:pulse .8s infinite}
#voice-indicator.speaking{background:var(--accent);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.voice-btn-large{padding:12px 24px;background:var(--accent);border:none;border-radius:var(--radius);color:#fff;font-size:16px;cursor:pointer;font-weight:600}
.voice-btn-large:hover{background:var(--accent2)}
.voice-content{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
#voice-text{font-size:18px;color:var(--fg);text-align:center;min-height:30px}
#files-list{flex:1;overflow-y:auto;padding:8px 20px;display:flex;flex-direction:column;gap:2px}
.file-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px}
.file-item:hover{background:var(--bg2)}
.file-item .icon{font-size:18px}
.file-item.dir{color:var(--accent);font-weight:500}
#file-path{font-size:12px;color:var(--fg2);padding:8px 20px;border-bottom:1px solid var(--bg3);flex-shrink:0}
#notes-area{flex:1;overflow-y:auto;padding:16px 20px}
#notes-input{width:100%;min-height:200px;background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);color:var(--fg);padding:14px;font-size:14px;resize:vertical;outline:none;font-family:inherit}
.settings-card{background:var(--bg2);border-radius:var(--radius);padding:24px;margin:20px;max-width:500px}
.settings-card h3{margin-bottom:4px;font-size:16px}
.settings-card p{font-size:12px;color:var(--fg2);margin-bottom:12px}
.settings-card a{color:var(--accent)}
.settings-card input{width:100%;padding:10px;background:var(--bg);border:1px solid var(--bg3);border-radius:var(--radius-sm);color:var(--fg);font-size:14px;margin-bottom:12px;outline:none}
.settings-card button{padding:10px 20px;background:var(--accent);border:none;border-radius:var(--radius-sm);color:#fff;font-weight:600;cursor:pointer}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:12px 24px;border-radius:var(--radius);font-size:14px;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none}
#toast.show{opacity:1}
.panel{flex:1;overflow-y:auto;padding:20px}
.card{background:var(--bg2);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:8px}
.card p,.card pre{font-size:13px;color:var(--fg2)}
.card button{padding:8px 16px;background:var(--accent);border:none;border-radius:var(--radius-sm);color:#fff;cursor:pointer;font-size:13px;margin-right:8px;margin-top:8px}
.card input{padding:8px;background:var(--bg);border:1px solid var(--bg3);border-radius:var(--radius-sm);color:var(--fg);font-size:13px;margin-right:8px;margin-top:8px}
pre{background:var(--bg);padding:12px;border-radius:var(--radius-sm);overflow-x:auto;font-size:12px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo"><span class="logo-icon">&#9670;</span> VELO</div>
<nav id="nav">
<button class="nav-btn active" data-view="chat">&#128172; Chat</button>
<button class="nav-btn" data-view="voice">&#127908; Voice</button>
<button class="nav-btn" data-view="files">&#128193; Files</button>
<button class="nav-btn" data-view="notes">&#128221; Notes</button>
<button class="nav-btn" data-view="settings">&#9881; Settings</button>
</nav>
<div class="sidebar-footer">v3.0 &#183; Portable &#183; Free</div>
</aside>
<main class="main">
<section class="view active" id="view-chat">
<div class="view-header"><h2>&#128172; Chat with VELO</h2><span class="status-badge ok" id="chat-status">Ready</span></div>
<div class="messages" id="messages"></div>
<div class="chat-bar">
<input id="chat-input" placeholder="Ask VELO anything..." onkeydown="if(event.key==='Enter')sendChat()">
<button id="send-btn" onclick="sendChat()">Send</button>
</div>
</section>
<section class="view" id="view-voice">
<div id="voice-status-bar"><div id="voice-indicator"></div><span id="voice-label">Click mic to start</span></div>
<div class="voice-content">
<button class="voice-btn-large" id="mic-btn" onclick="toggleMic()">&#127908; Start Listening</button>
<div id="voice-text"></div>
</div>
</section>
<section class="view" id="view-files">
<div class="view-header"><h2>&#128193; Files</h2><button onclick="refreshFiles()" style="background:var(--accent);border:none;color:#fff;padding:6px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px">Refresh</button></div>
<div id="file-path"></div>
<div id="files-list"></div>
</section>
<section class="view" id="view-notes">
<div class="view-header"><h2>&#128221; Notes</h2><button onclick="saveNotes()" style="background:var(--accent);border:none;color:#fff;padding:6px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px">Save</button></div>
<textarea id="notes-input" placeholder="Write your notes here..."></textarea>
</section>
<section class="view" id="view-settings">
<div class="view-header"><h2>&#9881; Settings</h2></div>
<div class="panel">
<div class="settings-card">
<h3>&#129302; Groq API Key (FREE - No Credit Card)</h3>
<p>Get your FREE key: <a href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a> &#8594; Login with Google &#8594; Create API Key</p>
<input type="password" id="api-key-input" placeholder="Paste key here (starts with gsk_)">
<button onclick="saveApiKey()">&#128190; Save Key</button>
<span id="key-status" style="margin-left:10px;font-size:13px;color:var(--green)"></span>
</div>
<div class="settings-card" style="margin-top:16px">
<h3>&#128269; Test Connection</h3>
<button onclick="testConnection()">&#128295; Test Groq API</button>
<div id="test-result" style="margin-top:8px;font-size:13px"></div>
</div>
</div>
</section>
</main>
</div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const GROQ_URL='https://api.groq.com/openai/v1/chat/completions';
const MODEL='llama-3.1-8b-instant';
let chatHistory=[];
let voiceListening=false;
let recognition=null;
let ttsOn=true;
function getApiKey(){return localStorage.getItem('velo_groq_key')||'';}
function saveApiKey(){
  let key=$('api-key-input').value.trim();
  if(!key){$('key-status').textContent='Enter a key first!';$('key-status').style.color='var(--red)';return;}
  if(!key.startsWith('gsk_')){
    $('key-status').textContent='Invalid! Must start with gsk_';
    $('key-status').style.color='var(--red)';
    return;
  }
  localStorage.setItem('velo_groq_key',key);
  $('key-status').textContent='Saved!';
  $('key-status').style.color='var(--green)';
  toast('API key saved! Now go to Chat and try.');
}
function loadApiKey(){
  const key=getApiKey();
  if(key) $('api-key-input').value=key;
}
function toast(msg){
  const t=$('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2600);
}
document.querySelectorAll('.nav-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
    $('view-'+btn.dataset.view).classList.add('active');
    if(btn.dataset.view==='files') refreshFiles();
    if(btn.dataset.view==='settings') loadApiKey();
    if(btn.dataset.view==='notes') loadNotes();
  });
});
const messagesEl=$('messages');
function addMsg(role,text,extra){
  const d=document.createElement('div');
  d.className='msg '+role+(extra?' '+extra:'');
  d.textContent=text;
  messagesEl.appendChild(d);
  messagesEl.scrollTop=messagesEl.scrollHeight;
  return d;
}
async function sendChat(text){
  if(!text){text=$('chat-input').value.trim();if(!text) return;}
  addMsg('user',text);
  chatHistory.push({role:'user',content:text});
  $('chat-input').value='';
  const key=getApiKey();
  if(!key){addMsg('err','No API key! Go to Settings tab, add FREE Groq key.');toast('Add Groq key in Settings!');return;}
  const typing=addMsg('bot','VELO soch raha hai...','typing');
  try{
    const msgs=[{role:'system',content:'You are VELO, a helpful AI desktop assistant. Reply in the language user uses (Hindi, English, or Hinglish). Be concise and friendly.'}].concat(chatHistory.slice(-20));
    const resp=await fetch(GROQ_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:MODEL,messages:msgs,max_tokens:1024,temperature:0.7})
    });
    typing.remove();
    if(!resp.ok){
      const err=await resp.json().catch(function(){return {};});
      const msg=err.error?err.error.message:'';
      if(resp.status===401){
        addMsg('err','Invalid API Key! Go to Settings and paste correct Groq key (starts with gsk_)');
        $('chat-status').textContent='Bad Key';
        $('chat-status').className='status-badge err';
      }else{
        addMsg('err','Error: '+msg);
      }
      return;
    }
    const data=await resp.json();
    const reply=data.choices?data.choices[0].message.content:'No response';
    addMsg('bot',reply);
    chatHistory.push({role:'assistant',content:reply});
    $('chat-status').textContent='Ready';
    $('chat-status').className='status-badge ok';
    if(ttsOn) speak(reply);
  }catch(e){typing.remove();addMsg('err','Network error: '+e.message);}
}
let audioCtx=null;
async function speakIndian(text){
  try{
    const url='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=hi&q='+encodeURIComponent(text.slice(0,200));
    if(!audioCtx) audioCtx=new AudioContext();
    const r=await fetch(url);
    const buf=await r.arrayBuffer();
    const dec=await audioCtx.decodeAudioData(buf);
    const src=audioCtx.createBufferSource();
    src.buffer=dec;src.connect(audioCtx.destination);src.start();
  }catch(e1){
    try{
      const u=new SpeechSynthesisUtterance(text);
      u.lang='en-IN';u.rate=0.95;u.pitch=1.15;
      const voices=speechSynthesis.getVoices();
      const ind=voices.find(function(v){return v.name.toLowerCase().includes('heera')||v.name.toLowerCase().includes('hemant');});
      if(ind) u.voice=ind;
      speechSynthesis.speak(u);
    }catch(e2){
      const u=new SpeechSynthesisUtterance(text);
      u.lang='en-IN';speechSynthesis.speak(u);
    }
  }
}
function speak(text){if(ttsOn&&text) speakIndian(text);}
function toggleMic(){if(voiceListening){stopMic();return;}startMic();}
function startMic(){
  try{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){toast('Use Chrome browser for voice');return;}
    recognition=new SR();
    recognition.lang='en-IN';
    recognition.continuous=true;
    recognition.interimResults=true;
    recognition.onresult=function(e){
      var final='';
      for(var i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) final+=e.results[i][0].transcript+' ';
      }
      if(final) $('voice-text').textContent=final;
    };
    recognition.onend=function(){
      if(voiceListening){
        try{recognition.start();}catch(e){}
      }else{
        $('mic-btn').textContent='Start Listening';
        $('voice-indicator').classList.remove('listening');
        $('voice-label').textContent='Click mic to start';
        var txt=$('voice-text').textContent.trim();
        if(txt){sendChat(txt);$('voice-text').textContent='';}
      }
    };
    recognition.onerror=function(e){
      if(e.error==='no-speech'||e.error==='audio-capture'){
        if(voiceListening) setTimeout(function(){try{recognition.start();}catch(e){}},500);
      }
    };
    recognition.start();
    voiceListening=true;
    $('mic-btn').textContent='Stop Mic';
    $('voice-indicator').classList.add('listening');
    $('voice-label').textContent='Listening (auto-restart active)';
    toast('Mic active - auto-restart ON');
  }catch(e){toast('Mic error: '+e.message);}
}
function stopMic(){
  voiceListening=false;
  if(recognition){try{recognition.stop();}catch(e){}}
  $('mic-btn').textContent='Start Listening';
  $('voice-indicator').classList.remove('listening');
  $('voice-label').textContent='Click mic to start';
}
async function refreshFiles(){
  var list=$('files-list');
  var pathEl=$('file-path');
  try{
    var dir=await window.showDirectoryPicker();
    pathEl.textContent=dir.name;
    list.innerHTML='';
    var entries=[];
    for await(var entry of dir.entries()){entries.push(entry);}
    entries.sort(function(a,b){return a[0].localeCompare(b[0]);});
    entries.forEach(function(e){
      var d=document.createElement('div');
      d.className='file-item'+(e[1].kind==='directory'?' dir':'');
      d.innerHTML=(e[1].kind==='directory'?'&#128193;':'&#128196;')+' '+e[0];
      list.appendChild(d);
    });
  }catch(e){list.innerHTML='<div class="file-item">Click Refresh and select a folder</div>';}
}
function loadNotes(){$('notes-input').value=localStorage.getItem('velo_notes')||'';}
function saveNotes(){localStorage.setItem('velo_notes',$('notes-input').value);toast('Notes saved!');}
setTimeout(loadNotes,500);
async function testConnection(){
  var key=getApiKey();
  if(!key){$('test-result').innerHTML='<span style="color:var(--red)">No key saved</span>';return;}
  $('test-result').textContent='Testing...';
  try{
    var resp=await fetch(GROQ_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:MODEL,messages:[{role:'user',content:'Say hello in Hindi'}],max_tokens:50})
    });
    if(resp.ok){
      var data=await resp.json();
      $('test-result').innerHTML='<span style="color:var(--green)">Connected! Reply: '+data.choices[0].message.content+'</span>';
    }else{
      var err=await resp.json().catch(function(){return {};});
      $('test-result').innerHTML='<span style="color:var(--red)">Error '+resp.status+': '+(err.error?err.error.message:'')+'</span>';
    }
  }catch(e){$('test-result').innerHTML='<span style="color:var(--red)">Network error: '+e.message+'</span>';}
}
loadApiKey();
console.log('VELO v3.0 ready');
</script>
</body>
</html>
